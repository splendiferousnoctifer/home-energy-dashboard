const b64=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
const wrap=document.getElementById("wrap"),err=document.getElementById("err");
async function derive(pass){
  const km=await crypto.subtle.importKey("raw",new TextEncoder().encode(pass),"PBKDF2",false,["deriveKey"]);
  return crypto.subtle.deriveKey({name:"PBKDF2",salt:b64(S),iterations:N,hash:"SHA-256"},km,{name:"AES-GCM",length:256},false,["decrypt"]);
}
const decrypt=async key=>new TextDecoder().decode(await crypto.subtle.decrypt({name:"AES-GCM",iv:b64(I)},key,b64(D)));
const idb=()=>new Promise((ok,no)=>{const r=indexedDB.open("pp",1);r.onupgradeneeded=()=>r.result.createObjectStore("k");r.onsuccess=()=>ok(r.result);r.onerror=()=>no(r.error);});
async function keyOp(mode,fn){const d=await idb();return new Promise((ok,no)=>{const t=d.transaction("k",mode),q=fn(t.objectStore("k"));t.oncomplete=()=>ok(q&&q.result);t.onerror=()=>no(t.error);});}
const saveKey=k=>keyOp("readwrite",s=>s.put(k,"key")),loadKey=()=>keyOp("readonly",s=>s.get("key")),clearKey=()=>keyOp("readwrite",s=>s.delete("key"));
function show(html){document.open();document.write(html);document.close();}
async function login(pass,remember,silent){
  try{
    const key=await derive(pass),html=await decrypt(key);

    if(!silent)err.textContent="Wrong passphrase.";

  }
}
