async function decrypt(pass){
  const km=await crypto.subtle.importKey("raw",new TextEncoder().encode(pass),"PBKDF2",false,["deriveKey"]);
  const key=await crypto.subtle.deriveKey({name:"PBKDF2",salt:b64(S),iterations:N,hash:"SHA-256"},km,{name:"AES-GCM",length:256},false,["decrypt"]);

function show(html){document.open();document.write(html);document.close();}
async function go(pass,remember,silent){

    if(remember){try{localStorage.setItem("pp",pass)}catch(e){}}
    show(html);
  }catch(e){
    if(!silent)document.getElementById("err").textContent="Wrong passphrase.";

}
